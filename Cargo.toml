[workspace]
members = [
    "crates/fallout_core",
    "crates/fallout_render",
    "crates/fallout_cli",
    "crates/fallout_tui",
    "crates/fallout_gui",
    "crates/fallout_web",
]
default-members = ["crates/fallout_core", "crates/fallout_cli"]
resolver = "2"

[workspace.package]
version = "0.1.6"
edition = "2024"
authors = ["Ali Raheem <ali.raheem@gmail.com>"]
repository = "https://github.com/Evgeny-Kot/fallout-se"
homepage = "https://github.com/Evgeny-Kot/fallout-se#readme"
license = "MIT OR Apache-2.0"
readme = "README.md"
