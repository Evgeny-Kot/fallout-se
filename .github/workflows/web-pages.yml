name: Deploy Web App

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '26.13.1'
      - name: Install repository-pinned Rust
        run: rustup show
      - name: Install locked binding generator
        run: cargo install wasm-bindgen-cli --version 0.2.108 --locked --root target/wasm-tools
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Build static web app with relative URLs
        run: python tools/build_web.py
      - name: Verify distribution
        run: node tools/browser/verify-dist.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: crates/fallout_web/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
